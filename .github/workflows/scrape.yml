name: Scrape Jobs

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # [P0-8] Healed selectors are downloaded from this raw URL at the start of
          # every run, then merged back below so self-healing survives across CI runs.
          SELECTOR_REGISTRY_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scraping_config.json
        run: python scraper_patched.py

      - name: Commit data and healed selectors if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/ scraping_config.json)" ]; then
            echo "No changes to jobs data or selectors"
          else
            git add data/ scraping_config.json
            git commit -m "chore: update jobs data and healed selectors [skip ci]"
            git push
          fi
